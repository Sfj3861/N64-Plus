name: N64_P Android CI

on:
  push:
    branches:
      - feature/n64p1-ui-snes-playback
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-debug-apk:
    name: Build debug APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android native build tools
        run: sdkmanager "cmake;3.22.1" "ndk;27.0.12077973"

      - name: Build N64_P debug APK
        run: |
          chmod +x Wii-GC/Source/Android/gradlew
          ./Wii-GC/Source/Android/gradlew -p . --no-daemon :app:assembleDebug

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk N64_P.1.debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: N64_P.1.debug.apk
          path: N64_P.1.debug.apk
          if-no-files-found: error
          retention-days: 14
