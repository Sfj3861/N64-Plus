name: N64_P Android CI

on:
  push:
    branches:
      - feature/n64p1-ui-snes-playback
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-debug-apk:
    name: Build ARM64 debug APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android native build tools
        run: sdkmanager "cmake;3.22.1" "ndk;27.0.12077973"

      - name: Fetch official Snes9x Libretro core for Android ARM64
        run: |
          mkdir -p app/src/main/jniLibs/arm64-v8a /tmp/snes9x-core
          curl --fail --location --retry 3 \
            https://buildbot.libretro.com/nightly/android/latest/arm64-v8a/snes9x_libretro_android.so.zip \
            --output /tmp/snes9x-core.zip
          unzip -o -j /tmp/snes9x-core.zip -d /tmp/snes9x-core
          CORE="$(find /tmp/snes9x-core -maxdepth 1 -type f -name '*.so' -print -quit)"
          test -n "$CORE"
          install -m 0644 "$CORE" app/src/main/jniLibs/arm64-v8a/libretro_snes.so
          test -s app/src/main/jniLibs/arm64-v8a/libretro_snes.so

      - name: Build N64_P debug APK
        run: |
          chmod +x Wii-GC/Source/Android/gradlew
          ./Wii-GC/Source/Android/gradlew -p . --no-daemon :app:assembleDebug

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk N64_P.1.debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: N64_P.1.debug.apk
          path: N64_P.1.debug.apk
          if-no-files-found: error
          retention-days: 14
