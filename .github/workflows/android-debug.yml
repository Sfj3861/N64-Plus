name: Android debug APK
on:
  push:
    branches: [feature/n64p1-ui-snes-playback]
  pull_request:
    branches: [integration/friendly-ui, feature/snes-library-detection]
  workflow_dispatch:
permissions:
  contents: read
  actions: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Configure Android SDK
        run: |
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"
          echo "/usr/local/lib/android/sdk/platform-tools" >> "$GITHUB_PATH"
          yes | /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager --licenses || true
          /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools" "cmake;3.22.1"
      - uses: gradle/actions/setup-gradle@v4
      - name: Build debug APK
        run: bash Wii-GC/Source/Android/gradlew --no-daemon assembleDebug
      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk N64_P.1.debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: N64_P.1.debug.apk
          path: N64_P.1.debug.apk
          if-no-files-found: error
