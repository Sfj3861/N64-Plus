name: Android debug APK
on:
  push:
    branches: [feature/snes-libretro-runtime-scaffold]
  pull_request:
    branches: [integration/friendly-ui, feature/snes-library-detection]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - name: Build debug APK
        run: ./gradlew assembleDebug
      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk N64_P.0.debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: N64_P.0.debug.apk
          path: N64_P.0.debug.apk
