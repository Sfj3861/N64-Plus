name: Import upstream emulator sources

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout N64 Plus
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Import upstream repositories
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p Wii-GC N64 SNES
          import_repo() {
            local url="$1" dest="$2" commit="$3"
            local tmp
            tmp="$(mktemp -d)"
            git clone --filter=blob:none "$url" "$tmp/repo"
            git -C "$tmp/repo" checkout "$commit"
            rsync -a --exclude='.git' "$tmp/repo/" "$dest/"
            rm -rf "$tmp"
          }
          import_repo https://github.com/dolphin-emu/dolphin.git Wii-GC 44a1e006d172b426c489581ee1c362b82438438d
          import_repo https://github.com/libretro/mupen64plus-libretro-nx.git N64 8623e490a8773fcb6c10f424cebbdb0ac44e88ea
          import_repo https://github.com/libretro/bsnes-libretro.git SNES f9344df74b3a6de49996cd4841038443ef595502
          cat > SOURCE_ORIGINS.md <<'EOF'
          # Source origins

          These source trees were copied from the upstream repositories at the pinned revisions below. They remain unmerged and unmodified as imports.

          | Directory | Upstream | Revision |
          |---|---|---|
          | Wii-GC | https://github.com/dolphin-emu/dolphin | 44a1e006d172b426c489581ee1c362b82438438d |
          | N64 | https://github.com/libretro/mupen64plus-libretro-nx | 8623e490a8773fcb6c10f424cebbdb0ac44e88ea |
          | SNES | https://github.com/libretro/bsnes-libretro | f9344df74b3a6de49996cd4841038443ef595502 |

          Check each imported tree's LICENSE and notices; see upstream for license details and third-party dependency notices.
          EOF
          git add Wii-GC N64 SNES SOURCE_ORIGINS.md
          if git diff --cached --quiet; then
            echo "No import changes detected."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Import pinned emulator source trees"
          git push
